    <nav class="navbar navbar-expand-lg navbar-baos" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="Img/baosLogoBlanco.png" alt="Logo SuperBaos" width="43" height="43" class="me-2">
          SuperBaos Bros
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>

            </li>

      </div>
    </nav>
  </header>
  <main class="contenedor-principal">
    
    <!-- Estilos exclusivos para la galería (respeta tu CSS original) -->
    <style>
      .grilla-galeria {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .galeria-item {
        background-color: #FFFFFF;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        border: 1px solid #e0e0e0;
        text-align: center;
      }
      .foto-galeria {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        transition: transform 0.3s ease;
      }
      .foto-galeria:hover {
        transform: scale(1.03); /* Efecto visual :hover requerido */
      }
    </style>

    <section class="hero-titulo" style="text-align: center; margin-top: 40px; margin-bottom: 30px;">
      <h1 style="margin-bottom: 5px;">GALERÍA DE FOTOS</h1>
      <p style="margin-top: 0;">UN RECORRIDO VISUAL POR NUESTROS MEJORES MOMENTOS Y PLATOS</p>
    </section>

    <!-- Grilla de la galería -->
    <section class="grilla-galeria">
      
      <article class="galeria-item">
        <img src="Img\preparacion.png" alt="Preparación de Baos" class="foto-galeria">
        <p style="margin-top: 10px; font-weight: bold;">Elaboración artesanal al vapor</p>
      </article>

      <article class="galeria-item">
        <img src="Img\localPorDentro.png" alt="Local por dentro" class="foto-galeria">
        <p style="margin-top: 10px; font-weight: bold;">Nuestro acogedor local</p>
      </article>

      <article class="galeria-item">
        <img src="Img\especialidad.png" alt="Bao especial" class="foto-galeria">
        <p style="margin-top: 10px; font-weight: bold;">Especialidad de la casa</p>
      </article>

      <article class="galeria-item">
        <img src="Img\momentos.png" alt="Clientes disfrutando" class="foto-galeria">
        <p style="margin-top: 10px; font-weight: bold;">Momentos SuperBaos</p>
      </article>

    </section>

  </main>

</body>

</html>
