<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-baos" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="Img/baosLogoBlanco.png" alt="Logo SuperBaos" width="43" height="43" class="me-2">
          SuperBaos Bros
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="menu.html">Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="ubicacion.html">Ubicacion</a>
            </li>
            <li>
              <a class="nav-link" href="contacto.html">Contactos</a>
            </li>
            <li>
              <a class="nav-link" href="galeria.html">Galeria</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="container mt-4">
    <h2 class="text-center mb-4">Menu de Baos</h2>
    <section class="menu-productos d-flex justify-content-center flex-wrap gap-4">
      <!--Aqui se separa debido que esto es un articulo en este caso el PRODUCTO-->
      <article class="tarjeta-producto text-center">
        <!--En esta parte hay que cambiar las imagenes para cada bao-->
        <img src="" alt="Bao de Cerdo" class="img-producto">
        <h3>Bao de Cerdo</h3>
        <p>Uno de los mejores baos para un dia agotador</p>
        <p class="precio-usd" data-precio="5">Precio: $5 USD</p>
        <!--En esta clase en el button lo que se agrega como succes significa = exito lo cual lo pinta de verde para la pag-->
        <!--Por otra parte en el agregarAl.. dentro tendria el STRING y otro seria el NUMBER-->
        <button class="btn btn-success" onclick="agregarAlCarrito('Bao de Cerdo', 5)">Añadir al Carrito</button>
      </article>
      <article>
        <!--Aqui usare lo mismo del article para agregar mas productos-->
      </article>
    </section>
    <section class="carrito-compras mt-5">
      <h3 class="text-center">Tu Pedido</h3>
      <!--table-striped seria una fila con colores distinguidos-->
      <!--thead es el encabezado de la tabla lo cual estaria agregando el th-->
      <table class="table table-striped mt-4 tabla-baos" id="tabla-carrito">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Accion</th>
          </tr>
        </thead>
      </table>
    </section>
  </main>
</body>

</html>
